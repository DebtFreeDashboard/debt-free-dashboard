<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,follow">
<title>DebtFree Dashboard</title>
<link rel="canonical" href="https://mydebtdashboard.com/app/dashboard.html">
<noscript><meta http-equiv="refresh" content="0; url=/app/dashboard.html"></noscript>
<!--
  Redirect shim. The app lives at /app/dashboard.html, but several posted
  captions sent people to /dashboard.html, which returned a GitHub Pages 404.
  Those captions can't all be edited, and anyone reaching this site from TikTok
  is typing the address by hand, so a dropped "/app/" will keep happening.
  This forwards them, query string and hash intact, so UTMs survive the hop.
-->
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    background: #0a0a0f; color: #f4f4f7;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 24px; text-align: center;
  }
  h1 { font-size: 1.15rem; margin: 0 0 10px; letter-spacing: -0.3px; }
  p  { margin: 0 0 20px; color: #9aa4ad; font-size: 0.95rem; line-height: 1.5; }
  a.btn {
    display: inline-block; background: #00e5b0; color: #05221b;
    text-decoration: none; font-weight: 700; padding: 13px 22px;
    border-radius: 10px; font-size: 0.98rem;
  }
</style>
</head>
<body>
  <main>
    <h1>DebtFree Dashboard</h1>
    <p id="msg">Taking you to the dashboard&hellip;</p>
    <a class="btn" id="go" href="/app/dashboard.html">Open the dashboard</a>
  </main>
<script>
(function () {
  var target = '/app/dashboard.html' + location.search + location.hash;
  var go = document.getElementById('go');
  if (go) go.href = target;

  // Offline: show the link, never auto-redirect. An installed PWA that can't
  // reach the network may serve a cached copy of THIS page as its offline
  // fallback; auto-redirecting would then bounce between the two forever.
  if (navigator.onLine === false) {
    var m = document.getElementById('msg');
    if (m) m.textContent = 'You appear to be offline. Open the dashboard once you reconnect.';
    return;
  }

  // replace(), not assign(), so Back returns to where they came from rather
  // than landing here and redirecting again.
  location.replace(target);
})();
</script>
</body>
</html>
