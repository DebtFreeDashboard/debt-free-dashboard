<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,follow">
<title>DebtFree Dashboard</title>
<link rel="canonical" href="https://mydebtdashboard.com/app/dashboard.html">
<noscript><meta http-equiv="refresh" content="0; url=/app/dashboard.html"></noscript>
<!--
  Short entry point for TikTok.

  TikTok gives this account no clickable link field, so the address in the
  profile is plain text somebody has to type out by hand, on a phone. The full
  app URL with its tracking parameters is 71 characters; this is 22, and it
  carries the same parameters without anyone having to type them. Keep the path
  short — every character is one more chance to give up or typo.
-->
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    background: #0a0a0f; color: #f4f4f7;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 24px; text-align: center;
  }
  h1 { font-size: 1.15rem; margin: 0 0 10px; letter-spacing: -0.3px; }
  p  { margin: 0 0 20px; color: #9aa4ad; font-size: 0.95rem; line-height: 1.5; }
  a.btn {
    display: inline-block; background: #00e5b0; color: #05221b;
    text-decoration: none; font-weight: 700; padding: 13px 22px;
    border-radius: 10px; font-size: 0.98rem;
  }
  a.btn.secondary {
    background: transparent; color: #00e5b0; border: 1px solid #00e5b0;
  }
  a.play { display: block; margin: 0 auto 16px; width: 200px; line-height: 0; }
  a.play img { display: block; width: 200px; height: auto; }
</style>
</head>
<body>
  <main>
    <h1>DebtFree Dashboard</h1>
    <p id="msg">Taking you to the dashboard&hellip;</p>
    <a class="play" id="play" href="https://play.google.com/store/apps/details?id=com.mydebtdashboard.app" hidden><img src="/assets/badges/google-play-badge.png" alt="Get it on Google Play" width="200" height="78"></a>
    <a class="btn" id="go" href="/app/dashboard.html">Open the dashboard</a>
  </main>
<script>
(function () {
  var params = new URLSearchParams('utm_source=tiktok&utm_medium=bio');
  // Anything already on the incoming URL wins, so a one-off tagged share
  // (a specific post, say) is not overwritten by the default.
  try {
    new URLSearchParams(location.search).forEach(function (v, k) { params.set(k, v); });
  } catch (e) {}

  var target = '/app/dashboard.html?' + params.toString() + location.hash;
  var go = document.getElementById('go');
  if (go) go.href = target;

  // Android: offer the Google Play app as well as the web app, and wait for a
  // tap. No auto-redirect here — Chrome won't hand an automatic jump to the
  // Play Store app, and the web app has to stay one tap away. The Play link
  // carries the same tags in its referrer so Play Console can credit TikTok
  // (Grow users > Store performance > Conversion analysis, by UTM source).
  if (/Android/i.test(navigator.userAgent || '')) {
    var ref = new URLSearchParams(params.toString());
    if (!ref.has('utm_campaign')) ref.set('utm_campaign', 'tt_page');
    var play = document.getElementById('play');
    if (play) {
      play.href = 'https://play.google.com/store/apps/details?id=com.mydebtdashboard.app'
        + '&referrer=' + encodeURIComponent(ref.toString());
      play.hidden = false;
    }
    var msg = document.getElementById('msg');
    if (msg) msg.textContent = 'Get the Android app, or use it in your browser.';
    if (go) { go.textContent = 'Use it in your browser'; go.className = 'btn secondary'; }
    return;
  }

  // Offline: show the link, never auto-redirect. A cached copy of this page
  // could otherwise bounce against the app's offline fallback forever.
  if (navigator.onLine === false) {
    var m = document.getElementById('msg');
    if (m) m.textContent = 'You appear to be offline. Open the dashboard once you reconnect.';
    return;
  }

  location.replace(target);
})();
</script>
</body>
</html>
